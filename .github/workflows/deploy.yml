name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-api:
    name: Deploy Worker API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Migrations run only from main. Staging shares the content database, so a
      # staging push must never alter the schema production is still serving.
      - name: Apply D1 migrations (production only)
        if: github.ref == 'refs/heads/main'
        run: npx wrangler d1 migrations apply bce-content --remote

      - name: Deploy Worker API
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            npx wrangler deploy --env production
          else
            npx wrangler deploy
          fi

  deploy-site:
    name: Deploy Website
    runs-on: ubuntu-latest
    needs: deploy-api
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Export Content Snapshot
        run: npm run content:export

      - name: Build Project
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME:-main}"
          if [ "${BRANCH_NAME}" = "main" ]; then
            PROJECT="bce-construction"
          else
            PROJECT="bce-construction-staging"
          fi
          echo "Deploying branch ${BRANCH_NAME} to Cloudflare Pages project ${PROJECT}..."
          npx wrangler pages deploy dist --project-name="${PROJECT}" --branch="${BRANCH_NAME}" --commit-dirty=true
