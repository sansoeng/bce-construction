<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
    <link rel="preload" href="/fonts/Aeonik-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Aeonik-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Aeonik-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/AeonikMono-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nokora:wght@300;400;500;600;700;800;900&family=Kantumruy+Pro:ital,wght@0,300..700;1,300..700&family=Noto+Sans+Khmer:wght@300;400;500;600;700&family=Noto+Serif+Khmer:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Like telhaclarke.com.au, the loader plays on every fresh page load; hide the page before paint so it can reveal it.
      // Skipped on the inner pages (projects, About, Our Businesses, Quality, Technical Capabilities, Request a Quote), and when arriving at a homepage #section from another site page.
      try {
        var params = new URLSearchParams(location.search);
        var isInner = ["project", "projects", "about", "businesses", "quality", "capabilities", "quote"].some(function (k) { return params.has(k); });
        var fromSite = !!location.hash && !!document.referrer && new URL(document.referrer).origin === location.origin;
        if (!isInner && !fromSite && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.documentElement.classList.add("is-loading", "has-loader");
          // The intro always starts at the top; drop any #section so the browser does not jump during the loader.
          if (location.hash) history.replaceState(null, "", location.pathname + location.search);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
