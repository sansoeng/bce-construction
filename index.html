<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
    <link rel="preload" href="/fonts/TTCommonsPro-Normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/TTCommonsPro-Md.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/TTCommonsProMono-Md.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanuman:wght@100;300;400;500;600;700;800;900&family=Kantumruy+Pro:ital,wght@0,300..700;1,300..700&family=Noto+Sans+Khmer:wght@300;400;500;600;700&family=Noto+Serif+Khmer:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Cloudflare Web Analytics (site created for bce-construction.com). Production hosts only, so staging previews
      // never mix their traffic into the live numbers. The token is public page data, not a secret.
      try {
        var host = location.hostname;
        if (host === "bce-construction.com" || host === "www.bce-construction.com") {
          var beacon = document.createElement("script");
          beacon.defer = true;
          beacon.src = "https://static.cloudflareinsights.com/beacon.min.js";
          beacon.setAttribute("data-cf-beacon", JSON.stringify({ token: "7f2f74c944fd47df94d580179c657431" }));
          document.head.appendChild(beacon);
        }
      } catch (e) {}
    </script>
    <script>
      // Like telhaclarke.com.au, the loader plays on every fresh page load; hide the page before paint so it can reveal it.
      // Skipped on the inner pages (projects, About, Our Businesses, Quality, Technical Capabilities, Request a Quote), and when arriving at a homepage #section from another site page.
      try {
        var params = new URLSearchParams(location.search);
        var isAdmin = location.hostname.indexOf("admin.") === 0 || params.has("admin");
        var path = location.pathname.replace(/\/+$/, "");
        var legacy = ["project", "projects", "about", "businesses", "business", "quality", "capabilities", "coverage", "quote", "resources", "recruitment", "careers", "contact", "blog", "news", "privacy", "terms"].some(function (k) { return params.has(k); });
        var isInner = isAdmin || legacy || (path !== "" && path !== "/");
        var fromSite = !!location.hash && !!document.referrer && new URL(document.referrer).origin === location.origin;
        if (!isInner && !fromSite && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.documentElement.classList.add("is-loading", "has-loader");
          // The intro always starts at the top; drop any #section so the browser does not jump during the loader.
          if (location.hash) history.replaceState(null, "", location.pathname + location.search);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- figma:body-start -->
    <a class="skip-link" href="#root">Skip to content</a>
    <div id="root" tabindex="-1"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
