<meta name="description" content="Our website is undergoing scheduled maintenance." />
<meta name="robots" content="noindex, nofollow" />

<style>
  @font-face {
    font-family: "TT Commons";
    src: url("/fonts/TTCommonsPro-Normal.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "TT Commons";
    src: url("/fonts/TTCommonsPro-Md.woff2") format("woff2");
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --ink: #111111;
    --paper: #ffffff;
    --brand: #f80100;
    --muted: rgb(17 17 17 / .6);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    padding: clamp(1.5rem, 3vw, 2.5rem) clamp(1.25rem, 5vw, 3rem);
    background: var(--paper);
    color: var(--ink);
    font-family: "TT Commons", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  header {
    display: flex;
    justify-content: center;
    flex: none;
  }

  .logo {
    display: block;
    height: 44px;
    width: auto;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: clamp(3rem, 8vh, 6rem) 0 clamp(3.5rem, 10vh, 7rem);
  }

  .mark {
    width: clamp(160px, 21vw, 240px);
    height: auto;
    margin-bottom: clamp(1.75rem, 3.5vw, 2.75rem);
  }

  .mark svg { display: block; width: 100%; height: auto; overflow: visible; }

  .gear--big {
    fill: none;
    stroke: var(--brand);
    stroke-width: 1.4;
    stroke-linejoin: round;
  }

  .gear--small {
    fill: none;
    stroke: rgb(17 17 17 / .32);
    stroke-width: 1.4;
    stroke-linejoin: round;
  }

  .spin {
    transform-origin: 12px 12px;
    animation: spin 26s linear infinite;
  }

  .spin--small {
    animation-duration: 14s;
    animation-direction: reverse;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 6.4vw, 54px);
    font-weight: 500;
    line-height: 1.05;
    letter-spacing: -.02em;
    text-transform: uppercase;
  }

  p {
    margin: clamp(1rem, 2vw, 1.35rem) 0 0;
    max-width: 34rem;
    font-size: clamp(1.02rem, 1.6vw, 1.28rem);
    font-weight: 400;
    line-height: 1.5;
    color: var(--muted);
  }

  @media (max-width: 560px) {
    main { padding-block: 2.5rem 3rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .spin { animation: none; }
  }
</style>
